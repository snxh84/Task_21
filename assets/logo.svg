<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OmniFood — healthy food">
  <defs>
    <path id="arc-top" d="M16 50 A34 34 0 0 1 84 50" />
    <path id="arc-bottom" d="M18 52 A32 32 0 0 0 82 52" />
  </defs>

  <!-- Rings -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffffff" stroke-width="2.4" />
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.75" />

  <!-- Circular text -->
  <text fill="#ffffff" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9.5" font-weight="700" letter-spacing="2.6">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">OMNIFOOD</textPath>
  </text>
  <text fill="#ffffff" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="7" font-weight="700" letter-spacing="2">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">HEALTHY FOOD</textPath>
  </text>

  <!-- Separator dots -->
  <circle cx="15.2" cy="50" r="1.7" fill="#ffffff" />
  <circle cx="84.8" cy="50" r="1.7" fill="#ffffff" />

  <!-- Crossed fork & knife -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-24 50 51)" fill="none" stroke-width="2.2">
      <path d="M45 35v7M50 35v7M55 35v7" />
      <path d="M45 42h10" />
      <path d="M50 42.5v24" />
    </g>
    <g transform="rotate(24 50 51)">
      <path d="M50 33c3.4 2.6 5.2 7 5.2 11.6 0 2.1-.4 4-1.2 5.4h-8c-.8-1.4-1.2-3.3-1.2-5.4C44.8 40 46.6 35.6 50 33z"
            fill="#ffffff" stroke="none" />
      <path d="M50 50.5v16.5" fill="none" stroke-width="3.2" />
    </g>
  </g>
</svg>
